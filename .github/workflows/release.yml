# Сборка и публикация релиза. Запускается при пуше тега вида v0.2.0
# (или вручную из вкладки Actions). Файлы получают постоянные имена, поэтому
# ссылки вида releases/latest/download/<файл> в README всегда ведут на свежую версию.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis,msi
      - name: Подготовка файлов
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/DesktopIsland-windows-setup.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName out/DesktopIsland-windows.msi
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/desktop-island.exe "portable/Desktop Island.exe"
          Compress-Archive -Path portable/* -DestinationPath out/DesktopIsland-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles deb,rpm,appimage
        env:
          NO_STRIP: "1"
      - name: Подготовка файлов
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/DesktopIsland-linux-x64.deb
          cp src-tauri/target/release/bundle/rpm/*.rpm out/DesktopIsland-linux-x64.rpm
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/DesktopIsland-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Контрольные суммы
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Desktop Island ${{ github.event.inputs.tag || github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
