[package]
name = "desktop-island"
version = "1.2.1"
description = "Desktop Island вЂ” РёРЅС‚РµСЂР°РєС‚РёРІРЅР°СЏ СЃРёСЃС‚РµРјРЅР°СЏ РїР°РЅРµР»СЊ РґР»СЏ Windows Рё Linux"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "desktop_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "net", "io-util"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network", "component"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
base64 = "0.22"
# Связь с телефоном (протокол KDE Connect): TLS с самоподписанными сертификатами.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
socket2 = { version = "0.6", features = ["all"] }
# Голосовые заметки: запись с микрофона в WAV.
cpal = "0.15"
hound = "3"
# Голос → текст (Vosk загружается по требованию) и распаковка моделей.
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"
semver = "1"
nvml-wrapper = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
drag = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
webview2-com = "0.39"
windows-core-wv2 = { package = "windows-core", version = "0.62" }
arboard = { version = "3", default-features = false, features = ["image-data"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Media_Ocr",
  "Graphics_Imaging",
  "Globalization",
  "Storage_Streams",
  "Devices_Radios",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Networking_Connectivity",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "ApplicationModel_DataTransfer",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Performance",
  "Win32_System_Wmi",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Bluetooth",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
x11rb = { version = "0.13", default-features = false, features = [] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtk = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
